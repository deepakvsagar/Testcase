<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --cell: #334155;
    --cell-hover: #475569;
    --x-color: #38bdf8;
    --o-color: #fb7185;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --win: #22c55e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  .game {
    background: var(--panel);
    padding: 2rem;
    border-radius: 1rem;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    text-align: center;
    width: min(92vw, 420px);
  }

  h1 {
    font-size: 1.8rem;
    letter-spacing: 0.05em;
    margin-bottom: 1rem;
  }

  h1 .x { color: var(--x-color); }
  h1 .o { color: var(--o-color); }

  .modes {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    margin-bottom: 1rem;
  }

  .modes button {
    flex: 1;
    padding: 0.5rem 0.75rem;
    border: 2px solid var(--cell);
    border-radius: 0.5rem;
    background: transparent;
    color: var(--muted);
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .modes button.active {
    border-color: var(--x-color);
    color: var(--text);
    background: rgba(56, 189, 248, 0.1);
  }

  .status {
    min-height: 1.5rem;
    margin-bottom: 1rem;
    font-size: 1.1rem;
    color: var(--muted);
  }

  .status strong.x { color: var(--x-color); }
  .status strong.o { color: var(--o-color); }
  .status.win { color: var(--win); }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.5rem;
    margin-bottom: 1.25rem;
  }

  .cell {
    aspect-ratio: 1;
    border: none;
    border-radius: 0.6rem;
    background: var(--cell);
    color: var(--text);
    font-size: clamp(2.2rem, 10vw, 3.2rem);
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .cell:hover:not(:disabled) {
    background: var(--cell-hover);
    transform: scale(1.03);
  }

  .cell:disabled { cursor: default; }
  .cell.x { color: var(--x-color); }
  .cell.o { color: var(--o-color); }

  .cell.winning {
    background: rgba(34, 197, 94, 0.25);
    box-shadow: inset 0 0 0 2px var(--win);
  }

  .scores {
    display: flex;
    justify-content: space-around;
    margin-bottom: 1.25rem;
    font-size: 0.95rem;
    color: var(--muted);
  }

  .scores span { display: block; font-size: 1.3rem; font-weight: 700; color: var(--text); }

  .reset {
    padding: 0.6rem 2rem;
    border: none;
    border-radius: 0.5rem;
    background: var(--x-color);
    color: #082f49;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.15s ease;
  }

  .reset:hover { filter: brightness(1.15); }
</style>
</head>
<body>
<div class="game">
  <h1><span class="x">Tic</span>-Tac-<span class="o">Toe</span></h1>

  <div class="modes">
    <button id="mode-pvp" class="active">2 Players</button>
    <button id="mode-cpu">vs Computer</button>
  </div>

  <p class="status" id="status"></p>

  <div class="board" id="board"></div>

  <div class="scores">
    <div>X wins<span id="score-x">0</span></div>
    <div>Draws<span id="score-d">0</span></div>
    <div>O wins<span id="score-o">0</span></div>
  </div>

  <button class="reset" id="reset">New Round</button>
</div>

<script>
(() => {
  const WIN_LINES = [
    [0, 1, 2], [3, 4, 5], [6, 7, 8],
    [0, 3, 6], [1, 4, 7], [2, 5, 8],
    [0, 4, 8], [2, 4, 6],
  ];

  const boardEl = document.getElementById("board");
  const statusEl = document.getElementById("status");
  const resetBtn = document.getElementById("reset");
  const modePvpBtn = document.getElementById("mode-pvp");
  const modeCpuBtn = document.getElementById("mode-cpu");
  const scoreEls = {
    X: document.getElementById("score-x"),
    O: document.getElementById("score-o"),
    D: document.getElementById("score-d"),
  };

  let board, current, gameOver, vsComputer = false;
  let roundId = 0;
  const scores = { X: 0, O: 0, D: 0 };

  const cells = [];
  for (let i = 0; i < 9; i++) {
    const cell = document.createElement("button");
    cell.className = "cell";
    cell.setAttribute("aria-label", `Cell ${i + 1}`);
    cell.addEventListener("click", () => handleMove(i));
    boardEl.appendChild(cell);
    cells.push(cell);
  }

  function newRound() {
    roundId++;
    board = Array(9).fill(null);
    current = "X";
    gameOver = false;
    cells.forEach((c) => {
      c.textContent = "";
      c.disabled = false;
      c.className = "cell";
    });
    updateStatus();
  }

  function updateStatus() {
    statusEl.classList.remove("win");
    statusEl.innerHTML = `Turn: <strong class="${current.toLowerCase()}">${current}</strong>`;
  }

  function findWin(b, player) {
    return WIN_LINES.find((line) => line.every((i) => b[i] === player)) || null;
  }

  function handleMove(i) {
    if (gameOver || board[i]) return;
    place(i, current);
    if (gameOver) return;
    if (vsComputer && current === "O") {
      const round = roundId;
      cells.forEach((c) => (c.disabled = true));
      setTimeout(() => {
        if (round !== roundId) return;
        board.forEach((v, idx) => { if (!v) cells[idx].disabled = false; });
        place(computerMove(), "O");
      }, 350);
    }
  }

  function place(i, player) {
    board[i] = player;
    cells[i].textContent = player;
    cells[i].classList.add(player.toLowerCase());
    cells[i].disabled = true;

    const winLine = findWin(board, player);
    if (winLine) {
      gameOver = true;
      winLine.forEach((idx) => cells[idx].classList.add("winning"));
      cells.forEach((c) => (c.disabled = true));
      scores[player]++;
      scoreEls[player].textContent = scores[player];
      statusEl.classList.add("win");
      statusEl.innerHTML = `<strong class="${player.toLowerCase()}">${player}</strong> wins!`;
      return;
    }

    if (board.every(Boolean)) {
      gameOver = true;
      scores.D++;
      scoreEls.D.textContent = scores.D;
      statusEl.textContent = "It's a draw!";
      return;
    }

    current = player === "X" ? "O" : "X";
    updateStatus();
  }

  // Minimax: the computer (O) plays perfectly.
  function computerMove() {
    let bestScore = -Infinity;
    let bestMove = -1;
    for (let i = 0; i < 9; i++) {
      if (!board[i]) {
        board[i] = "O";
        const score = minimax(board, 0, false);
        board[i] = null;
        if (score > bestScore) {
          bestScore = score;
          bestMove = i;
        }
      }
    }
    return bestMove;
  }

  function minimax(b, depth, isMaximizing) {
    if (findWin(b, "O")) return 10 - depth;
    if (findWin(b, "X")) return depth - 10;
    if (b.every(Boolean)) return 0;

    const player = isMaximizing ? "O" : "X";
    let best = isMaximizing ? -Infinity : Infinity;
    for (let i = 0; i < 9; i++) {
      if (!b[i]) {
        b[i] = player;
        const score = minimax(b, depth + 1, !isMaximizing);
        b[i] = null;
        best = isMaximizing ? Math.max(best, score) : Math.min(best, score);
      }
    }
    return best;
  }

  function setMode(cpu) {
    vsComputer = cpu;
    modePvpBtn.classList.toggle("active", !cpu);
    modeCpuBtn.classList.toggle("active", cpu);
    newRound();
  }

  modePvpBtn.addEventListener("click", () => setMode(false));
  modeCpuBtn.addEventListener("click", () => setMode(true));
  resetBtn.addEventListener("click", newRound);

  newRound();
})();
</script>
</body>
</html>

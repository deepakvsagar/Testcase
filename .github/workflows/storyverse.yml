name: StoryVerse

on:
  push:
    paths: ['storyverse/**', '.github/workflows/storyverse.yml']
  pull_request:
    paths: ['storyverse/**', '.github/workflows/storyverse.yml']
  workflow_dispatch:

jobs:
  worker:
    name: Worker build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storyverse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - run: npm run validate
      - run: npm run test:worker

  ios:
    name: iOS app build and unit tests
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: storyverse/ios
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Pick an iPhone simulator
        id: sim
        run: |
          id=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" in runtime:
                  for device in devices[runtime]:
                      if device["name"].startswith("iPhone"):
                          print(device["udid"]); sys.exit()
          ')
          echo "Using simulator $id"
          echo "udid=$id" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project StoryVerse.xcodeproj \
            -scheme StoryVerse \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning: .*StoryVerse|Test Case|Executed|BUILD|TEST" || true
          grep -q "TEST SUCCEEDED" build.log
      - name: Capture simulator screenshots
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/StoryVerse.app
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          mkdir -p screenshots
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$UDID" "$APP"
          shot() { sleep 8; xcrun simctl io "$UDID" screenshot "screenshots/$1.png"; xcrun simctl terminate "$UDID" "$BUNDLE" || true; }
          xcrun simctl launch "$UDID" "$BUNDLE"; shot 1-launch
          xcrun simctl launch "$UDID" "$BUNDLE" -StoryVerseShowAccount; shot 2-account
          ls -la screenshots
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: storyverse/ios/screenshots
